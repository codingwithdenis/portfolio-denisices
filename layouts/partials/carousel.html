<script>
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-prev], [data-next]')
  if(!btn) return
  const carousel = btn.closest('[data-carousel]')
  const track = carousel.querySelector('[data-track]')
  const dir = btn.hasAttribute('data-next') ? 1 : -1
  const w = track.querySelector('.carousel-slide').offsetWidth
  track.scrollBy({left: w * dir, behavior:'smooth'})
})
document.addEventListener('scroll', function(e){
  const track = e.target.closest('[data-track]')
  if(!track) return
  const carousel = track.closest('[data-carousel]')
  const dots = carousel.querySelector('[data-dots]')
  if(!dots) return
  const w = track.querySelector('.carousel-slide').offsetWidth
  const idx = Math.round(track.scrollLeft / w)
  dots.querySelectorAll('.carousel-dot').forEach((d,i) => d.classList.toggle('active',i===idx))
})
document.addEventListener('click', function(e){
  const dot = e.target.closest('[data-dot]')
  if(!dot) return
  const carousel = dot.closest('[data-carousel]')
  const track = carousel.querySelector('[data-track]')
  const w = track.querySelector('.carousel-slide').offsetWidth
  track.scrollTo({left: w * parseInt(dot.dataset.dot), behavior:'smooth'})
})
</script>
