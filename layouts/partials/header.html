<header>
  <div class="header-inner">
    <div>
      <a href="/" style="text-decoration:none;color:inherit">
        <div class="header-name">Denis<span class="dot">.</span></div>
      </a>
      <div class="header-role">{{ .Site.Params.role }}</div>
    </div>
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        {{ if eq .Identifier "all" }}
          <a href="/" data-filter="all"{{ if $.IsHome }} class="active"{{ end }}>{{ .Name }}</a>
        {{ else if eq .Identifier "info" }}
          <a href="/info/" data-filter="info"{{ if eq $.RelPermalink "/info/" }} class="active"{{ end }}>{{ .Name }}</a>
        {{ else }}
          <a href="/?filter={{ .Identifier }}" data-filter="{{ .Identifier }}">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>
  </div>
</header>
